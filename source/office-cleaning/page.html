<main class="office-wf">
<section class="office-wf__hero" aria-labelledby="office-wf-title">
<img src="/assets/images/office-cleaning/floor.png" alt="大きな窓と広いフロアのある${mosaic_kicker}の空間" width="1536" height="1024" loading="eager" decoding="async" fetchpriority="high">
<div class="office-wf__hero-inner"><div class="office-wf__hero-copy">
<h1 id="office-wf-title">${title}</h1>
<p class="office-wf__hero-word">${hero}</p>
${inquiry}
</div></div>
</section>
<div class="office-wf__layout">
<section class="office-wf__mosaic" id="office-wf-workplace" aria-labelledby="office-wf-workplace-title">
<div class="office-wf__mosaic-mat" aria-hidden="true"></div>
<h2 class="office-wf__mosaic-heading" id="office-wf-workplace-title">${mosaic_heading}</h2>
<div class="office-wf__mosaic-body">
<p class="office-wf__mosaic-body-intro">${mosaic_intro}</p>
<p class="office-wf__mosaic-body-care">${mosaic_care}</p>
<p class="office-wf__mosaic-body-welcome">${mosaic_welcome}</p>
</div>
<figure class="office-wf__carpet"><img src="/assets/images/office-cleaning/carpet.png" alt="床・カーペット" width="1536" height="1024" loading="lazy" decoding="async"></figure>
<div class="office-wf__mosaic-label"><p class="office-wf__mosaic-label-title">${mosaic_label}</p><span class="office-wf__mosaic-label-kicker">${mosaic_kicker}</span></div>
<figure class="office-wf__basin"><img src="/assets/images/office-cleaning/basin.png" alt="洗面所" width="1536" height="1024" loading="lazy" decoding="async"></figure>
</section>
</div>
<section class="office-wf__kitchen" aria-label="厨房と換気設備のお掃除">
<p class="office-wf__kitchen-copy">${kitchen}</p>
<div class="office-wf__kitchen-pair">
<figure><img src="/assets/images/office-cleaning/kitchen.png" alt="厨房器具" width="1536" height="1024" loading="lazy" decoding="async"></figure>
<figure><img src="/assets/images/office-cleaning/hood.png" alt="レンジフード" width="1536" height="1024" loading="lazy" decoding="async"></figure>
</div>
</section>
<section class="office-wf__points c-home" id="office-wf-points" aria-label="ご相談いただける清掃">
<div class="c-grid c-reasons c-reasons--navy" style="--grid-col-pc:repeat(3,1fr); --grid-gap-pc:0; --grid-col-sp:repeat(1,1fr); --grid-gap-sp:24px;">${points}</div>
</section>
<section class="office-wf__section office-wf__range-section" aria-labelledby="office-wf-range-title"><div class="office-wf__container"><header class="office-wf__section-head"><h2 id="office-wf-range-title">${gallery_title}</h2></header><div class="office-wf__gallery">${gallery}</div></div></section>
<section class="office-wf__section office-wf__contact" id="office-wf-contact" aria-labelledby="office-wf-contact-title"><div class="office-wf__container office-wf__contact-grid"><h2 id="office-wf-contact-title">${contact_title}</h2><p>${contact_text}</p>${inquiry}</div></section>
</main>
